<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="阿章 · 沮丧 Depressed"><title>阿章 · 沮丧 Depressed</title><desc>阿章 的 沮丧 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-slump 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
