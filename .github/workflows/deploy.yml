name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/service:${{ github.sha }},${{ env.REGISTRY }}/${{ github.repository }}/service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.admin
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.sha }},${{ env.REGISTRY }}/${{ github.repository }}/admin:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push admin-php
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.admin-php
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/admin-php:${{ github.sha }},${{ env.REGISTRY }}/${{ github.repository }}/admin-php:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy notification
        run: |
          echo "Deploying to ${{ github.event.inputs.environment }}"
          echo "Service: ${{ env.REGISTRY }}/${{ github.repository }}/service:${{ github.sha }}"
          echo "Admin: ${{ env.REGISTRY }}/${{ github.repository }}/admin:${{ github.sha }}"
          echo "Admin-php: ${{ env.REGISTRY }}/${{ github.repository }}/admin-php:${{ github.sha }}"
          echo "Add SSH/deploy steps for ${{ github.event.inputs.environment }} server"
