version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ads-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ads
      MYSQL_USER: ads
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./install.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: ads-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redis_data:/data]

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ads-php
    depends_on: [mysql, redis]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ads
      DB_USERNAME: ads
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - ./service/.env:/app/.env
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: ads-nginx
    ports: ["80:80"]
    depends_on: [php]
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
