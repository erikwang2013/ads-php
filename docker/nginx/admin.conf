# Nginx configuration for Ads Platform
# Supports: multi-service upstream (horizontal scaling), static cache headers, gzip, rate limiting

upstream service_api {
    # Multiple service instances for horizontal scaling
    # Add more instances: server php2:8788 weight=1;
    server php:8788 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 100;
}

# Security: limit request rate per IP (http context)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn:10m;

# Keep the scheme supplied by a TLS-terminating upstream (default: direct http).
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# If TLS terminates at a trusted proxy, set its CIDR and enable real_ip:
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# Without this, $remote_addr is the proxy IP and per-IP limits / JWT IP binding
# see every client as the same address.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Web installer (public; blocks itself once .installed exists) ───
    location = /install {
        proxy_pass http://service_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ─── Uploaded assets (^~ must beat the static-file regex below) ───
    location ^~ /uploads/ {
        proxy_pass http://service_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # ─── API proxy to service ───
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn 20;

        proxy_pass http://service_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # ─── Health check ───
    location /health {
        proxy_pass http://service_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # ─── Static assets with long-cache headers ───
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header Vary "Accept-Encoding";
        gzip_static on;
    }

    # ─── Admin SPA ───
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    # ─── Gzip ───
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_proxied any;
}
