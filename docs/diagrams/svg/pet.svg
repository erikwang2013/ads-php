<!-- 项目宠物「阿鸮」— 手写 SVG，非 render.py 生成（无 .mmd 源，故不参与图表渲染流程）。
     不含文字，13 种语言文档共用同一份，勿加语言后缀。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">Ads Platform mascot — 阿鸮, the watch owl</title>
  <desc id="petDesc">An owl inside a radar halo, guarding 29 ad platforms. Eyes blink.</desc>

  <defs>
    <linearGradient id="petBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E5288"/>
      <stop offset="1" stop-color="#16213E"/>
    </linearGradient>
    <linearGradient id="petWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26466F"/>
      <stop offset="1" stop-color="#12203A"/>
    </linearGradient>
  </defs>

  <!-- radar halo — 监控值守 -->
  <g fill="none" stroke="#409EFF" stroke-linecap="round">
    <circle cx="120" cy="122" r="106" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="120" cy="122" r="94" stroke-opacity="0.09" stroke-width="2">
      <animate attributeName="r" values="94;100;94" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.09;0.20;0.09" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M120 122 L206 70" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="5 7">
      <animateTransform attributeName="transform" type="rotate" values="0 120 122;360 120 122" dur="12s" repeatCount="indefinite"/>
    </path>
    <circle cx="120" cy="122" r="4" fill="#409EFF" stroke="none" opacity="0.55"/>
  </g>

  <!-- ear tufts -->
  <path d="M72 84 C62 64 56 46 58 30 C78 36 102 46 118 56 Z" fill="url(#petWing)"/>
  <path d="M168 84 C178 64 184 46 182 30 C162 36 138 46 122 56 Z" fill="url(#petWing)"/>

  <!-- wings -->
  <path d="M68 132 C48 146 46 186 60 206 C74 196 82 160 78 132 Z" fill="url(#petWing)"/>
  <path d="M172 132 C192 146 194 186 180 206 C166 196 158 160 162 132 Z" fill="url(#petWing)"/>

  <!-- body -->
  <path d="M120 56 C152 56 176 78 178 112 C180 146 182 176 176 192 C168 208 148 216 120 216 C92 216 72 208 64 192 C58 176 60 146 62 112 C64 78 88 56 120 56 Z" fill="url(#petBody)"/>

  <!-- facial disc -->
  <ellipse cx="120" cy="106" rx="53" ry="43" fill="#EAF2FF"/>

  <!-- chest -->
  <ellipse cx="120" cy="178" rx="38" ry="32" fill="#EAF2FF"/>
  <g fill="none" stroke="#A9C6EE" stroke-width="3.6" stroke-linecap="round">
    <path d="M107 166 L120 176 L133 166"/>
    <path d="M107 180 L120 190 L133 180"/>
    <path d="M109 194 L120 203 L131 194"/>
  </g>

  <!-- beak -->
  <path d="M120 112 L132 124 L120 142 L108 124 Z" fill="#FFB020"/>

  <!-- eyes -->
  <g>
    <circle cx="95" cy="104" r="24" fill="#FFFFFF"/>
    <circle cx="145" cy="104" r="24" fill="#FFFFFF"/>
    <circle cx="95" cy="104" r="14" fill="#409EFF"/>
    <circle cx="145" cy="104" r="14" fill="#409EFF"/>
    <circle cx="95" cy="104" r="7" fill="#16213E"/>
    <circle cx="145" cy="104" r="7" fill="#16213E"/>
    <circle cx="88.5" cy="97.5" r="4.2" fill="#FFFFFF"/>
    <circle cx="138.5" cy="97.5" r="4.2" fill="#FFFFFF"/>
  </g>
  <!-- blink: lids in facial-disc colour, so the eye simply vanishes -->
  <ellipse cx="95" cy="104" rx="25" ry="0" fill="#EAF2FF">
    <animate attributeName="ry" values="0;0;26;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="145" cy="104" rx="25" ry="0" fill="#EAF2FF">
    <animate attributeName="ry" values="0;0;26;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- feet -->
  <g fill="#FFB020">
    <rect x="90" y="204" width="24" height="16" rx="8"/>
    <rect x="126" y="204" width="24" height="16" rx="8"/>
  </g>
</svg>
