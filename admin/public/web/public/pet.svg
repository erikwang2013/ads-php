<!-- 项目宠物「阿章」— 手写 SVG，非 render.py 生成（无 .mmd 源，故不参与图表渲染流程）。
     八条触手 = 8 个 service 插件；外环 29 个节点 = 29 个广告平台。
     不含文字，13 种语言文档共用同一份，勿加语言后缀。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">Ads Platform mascot — A-Zhang, the eight-armed octopus</title>
  <desc id="petDesc">An octopus whose eight arms stand for the eight service plugins, reaching out to 29 platform nodes on the data ring. Eyes blink.</desc>

  <defs>
    <linearGradient id="petBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E6FB0"/>
      <stop offset="1" stop-color="#17233F"/>
    </linearGradient>
    <linearGradient id="petArm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35619E"/>
      <stop offset="1" stop-color="#14203A"/>
    </linearGradient>
  </defs>

  <!-- 29 platform nodes on the data ring -->
  <g fill="none" stroke="#409EFF">
    <circle cx="120" cy="120" r="112" stroke-opacity="0.15" stroke-width="1.6"/>
    <circle cx="120" cy="120" r="100" stroke-opacity="0.06" stroke-width="1.6"/>
  </g>
  <g fill="#409EFF" fill-opacity="0.42">
      <circle cx="120.0" cy="8.0" r="3.2"/>
      <circle cx="144.1" cy="10.6" r="3.2"/>
      <circle cx="167.0" cy="18.4" r="3.2"/>
      <circle cx="187.8" cy="30.8" r="3.2"/>
      <circle cx="205.4" cy="47.5" r="3.2"/>
      <circle cx="219.0" cy="67.5" r="3.2"/>
      <circle cx="227.9" cy="90.0" r="3.2"/>
      <circle cx="231.8" cy="113.9" r="3.2"/>
      <circle cx="230.5" cy="138.1" r="3.2"/>
      <circle cx="224.0" cy="161.5" r="3.2"/>
      <circle cx="212.7" cy="182.9" r="3.2"/>
      <circle cx="197.0" cy="201.3" r="3.2"/>
      <circle cx="177.7" cy="216.0" r="3.2"/>
      <circle cx="155.8" cy="226.1" r="3.2"/>
      <circle cx="132.1" cy="231.3" r="3.2"/>
      <circle cx="107.9" cy="231.3" r="3.2"/>
      <circle cx="84.2" cy="226.1" r="3.2"/>
      <circle cx="62.3" cy="216.0" r="3.2"/>
      <circle cx="43.0" cy="201.3" r="3.2"/>
      <circle cx="27.3" cy="182.9" r="3.2"/>
      <circle cx="16.0" cy="161.5" r="3.2"/>
      <circle cx="9.5" cy="138.1" r="3.2"/>
      <circle cx="8.2" cy="113.9" r="3.2"/>
      <circle cx="12.1" cy="90.0" r="3.2"/>
      <circle cx="21.0" cy="67.5" r="3.2"/>
      <circle cx="34.6" cy="47.5" r="3.2"/>
      <circle cx="52.2" cy="30.8" r="3.2"/>
      <circle cx="73.0" cy="18.4" r="3.2"/>
      <circle cx="95.9" cy="10.6" r="3.2"/>
  </g>

  <!-- 8 arms = 8 service plugins: 4 drawn, 4 mirrored -->
  <g id="azArms">
    <g fill="none" stroke="url(#petArm)" stroke-width="20" stroke-linecap="round">
      <path d="M80 132 C58 124 38 104 32 84 C28 70 32 60 42 56"/>
      <path d="M72 146 C54 148 36 152 28 162 C22 170 24 180 32 182"/>
      <path d="M78 154 C70 172 58 190 44 200 C36 206 28 204 26 196"/>
      <path d="M98 160 C94 180 90 200 86 214 C84 222 90 226 96 222"/>
    </g>
    <g fill="#FFB020" fill-opacity="0.85">
      <circle cx="33.2" cy="98.2" r="4"/>
      <circle cx="26.1" cy="70.3" r="4"/>
      <circle cx="31.4" cy="152.9" r="4"/>
      <circle cx="20.0" cy="170.3" r="4"/>
      <circle cx="48.9" cy="189.8" r="4"/>
      <circle cx="36.3" cy="208.0" r="4"/>
      <circle cx="83.9" cy="203.8" r="4"/>
      <circle cx="82.5" cy="223.0" r="4"/>
    </g>
  </g>
  <use href="#azArms" transform="translate(240,0) scale(-1,1)"/>

  <!-- mantle -->
  <path d="M120 34 C150 34 174 56 176 92 C177 114 174 136 168 148 C152 156 88 156 72 148 C66 136 63 114 64 92 C66 56 90 34 120 34 Z" fill="url(#petBody)"/>

  <!-- smile -->
  <path d="M112 131 Q120 139 128 131" fill="none" stroke="#16213E" stroke-width="3.4" stroke-linecap="round" opacity="0.7"/>

  <!-- eyes -->
  <g>
    <circle cx="96" cy="100" r="22" fill="#FFFFFF"/>
    <circle cx="144" cy="100" r="22" fill="#FFFFFF"/>
    <circle cx="96" cy="100" r="13" fill="#409EFF"/>
    <circle cx="144" cy="100" r="13" fill="#409EFF"/>
    <circle cx="96" cy="100" r="7" fill="#16213E"/>
    <circle cx="144" cy="100" r="7" fill="#16213E"/>
    <circle cx="89.5" cy="93.5" r="4.2" fill="#FFFFFF"/>
    <circle cx="137.5" cy="93.5" r="4.2" fill="#FFFFFF"/>
  </g>
  <!-- blink: lids in the mantle tone, so the eye simply vanishes -->
  <ellipse cx="96" cy="100" rx="23" ry="0" fill="#294673">
    <animate attributeName="ry" values="0;0;24;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="144" cy="100" rx="23" ry="0" fill="#294673">
    <animate attributeName="ry" values="0;0;24;0;0" keyTimes="0;0.90;0.94;0.98;1" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- slow breathing -->
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="5s" repeatCount="indefinite"/>
</svg>
